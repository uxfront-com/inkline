<div>
  <div aria-label="Fruit" id="fruit" role="radiogroup">
    <label>
      <input name="fruit" type="radio" uf:checked="true" value="apple">
      "Apple"
    </label>
    <label>
      <input name="fruit" type="radio" uf:checked="false" value="pear">
      "Pear"
    </label>
    <label>
      <input name="fruit" type="radio" uf:checked="false" value="fig">
      "Fig"
    </label>
  </div>
  <output>
    "apple"
  </output>
</div>
