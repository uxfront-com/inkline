# TS6 holdout catalog. TypeScript 7's native compiler drops the classic
# programmatic JS API (`ts.createProgram`/`factory`/`printer` now live under
# the reshaped `typescript/unstable/*` surface). Packages that consume that
# API — directly or through a toolchain that does — stay on the aliased TS6
# release via `catalog:ts6` until their dependency ports to TS7:
#   - ui/vue              — @vue/compiler-sfc resolves tsconfig `paths` (the
#                           `virtual:styleframe` alias behind `defineProps`
#                           `extends`) through TS's classic config API, which
#                           TS7 no longer exposes; SFC compile fails on TS7.
#   - ui/angular          — @analogjs/vite-plugin-angular's js-emitter calls
#                           `ts.createPrinter`. (See packageExtensions below — the
#                           analog plugin does a bare undeclared `import
#                           "typescript"`, so it needs a peer to honor this pin.)
#   - tooling/toolchain-angular — the same Angular compiler stack, where
#                           `unframework test`, `visual` and `preview` load it.
#   - apps/docs           — the website's Vue SFCs go through the same
#                           @vue/compiler-sfc as ui/vue, and break on TS7.
catalogs:
  ts6:
    typescript: npm:@typescript/typescript6@^6.0.2
  # Unframework's test, visual and preview tools peer on these exact versions, so `ui/components`
  # takes them from here instead of the vite-plus aliases in `catalog:` (see `overrides` below).
  unframework:
    vite: 8.3.1
    vitest: 5.0.3

catalogMode: prefer
# @analogjs/vite-plugin-angular consumes `typescript` via a bare, undeclared
# `import "typescript"` (no dep/peer entry of its own), so pnpm can't route
# ui/angular's `catalog:ts6` pin to it and its js-emitter resolves the default
# TS7 — where `ts.createPrinter` is gone. Declaring the peer lets the pin flow.
packageExtensions:
  "@analogjs/vite-plugin-angular":
    peerDependencies:
      typescript: "*"
# The monorepo-wide `vite: catalog:` override routes every package's vite to the
# vite-plus (rolldown) alias. The Nuxt website is the one exception: its
# @nuxt/content client DB ships a @sqlite.org/sqlite-wasm web worker whose
# `import.meta.url` worker-entry bundling crashes under vite-plus (reproduced on
# 0.2.4 and 0.2.5 alike — a rolldown worker-bundling gap, not a version
# regression). Scope the Nuxt vite builder back to upstream vite so the docs
# site prerenders; the @vitejs/plugin-vue* plugins take vite as a peer and
# resolve to this same real vite. Everything else keeps vite-plus. The range
# follows the vite 8 line `@nuxt/vite-builder` declares for the website's Nuxt
# (4.6): vite 7 has no `rolldownOptions`, and the builder throws on it.
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `ui/components` tests, renders and previews through Unframework, whose tools peer on the real
  # Vite and Vitest, at the versions of the `unframework` catalog. So do its Angular toolchain and
  # the Vitest packages they load.
  "@inkline/components>vite": "catalog:unframework"
  "@inkline/components>vitest": "catalog:unframework"
  "@inkline/toolchain-angular>vite": "catalog:unframework"
  # vite-plugin-solid adds jest-dom as a setup file of every non-browser Vitest project when it can
  # resolve it, and it resolves it from its own directory, where the project can't. No package here
  # uses jest-dom, so its optional peer stays uninstalled, as in Unframework's own workspace.
  "vite-plugin-solid>@testing-library/jest-dom": "-"
  "@nuxt/vite-builder>vite": "^8.3.2"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
    - "@angular-devkit/architect"
    - "@angular-devkit/core"
    - "@vitejs/plugin-react"
    - typescript
  allowedVersions:
    vite: "*"
    vitest: "*"
    "@angular-devkit/architect": "*"
    "@angular-devkit/core": "*"
    "@vitejs/plugin-react": "*"
    typescript: "*"
