packages:
  - apps/*
  - tooling/*
  - ui/*
  - tools/*
allowBuilds:
  "@parcel/watcher": true
  "@uxfront/layer-docs": false
  better-sqlite3: true
  core-js: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  vue-demi: true

# pnpm 11 enforces a default minimumReleaseAge (24h) supply-chain guard.
# Exclude the styleframe first-party ecosystem (intentionally fresh, trusted),
# the uxfront packages the website builds on (freshly published,
# first-party), Unframework's test and visual tools under @unframework.dev
# (first-party, published by the owner and consumed the day they ship), and pin
# the exact versions of unrelated transitive deps caught as collateral so the
# guard still applies to any future releases of those.
minimumReleaseAgeExclude:
  - "@styleframe/*"
  - styleframe
  - "@uxfront/*"
  - "@unframework.dev/*"
  - ansis@4.3.1
  - js-yaml@4.2.0
  - launch-editor@2.14.1

