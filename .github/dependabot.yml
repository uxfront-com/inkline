version: 2
updates:
  # npm packages across the pnpm workspace, catalogs included. A new release waits 3 days
  # before an update PR proposes it, and a new major waits 14 days. Each package goes into
  # the first group it matches: first-party packages at any update type, then third-party
  # minors and patches, then third-party majors, so each week brings at most three PRs.
  # @types/node majors are ignored.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      first-party:
        patterns: ["@uxfront/*", "@styleframe/*", "styleframe"]
      third-party:
        patterns: ["*"]
        update-types: [minor, patch]
      third-party-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # @types/node follows the Node version the repository runs on, not the latest major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
