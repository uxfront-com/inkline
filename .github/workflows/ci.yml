name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Build packages
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          retention-days: 1
          include-hidden-files: true
          path: |
            ui/*/dist
            ui/*/.styleframe

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: ui

      # `generate`, not `build`: the site ships as a fully prerendered static
      # bundle (docs/adrs/007-website-ships-as-a-static-site.md). Only `generate`
      # emits robots.txt, sitemap.xml, 200.html and 404.html, so building the
      # other way would leave CI green while the deploy artifact is missing
      # exactly the files the deploy needs.
      - name: Build website
        run: pnpm --filter website run generate
        env:
          NODE_ENV: production

      # Consumes the artifact the step above produced, which is why it lives
      # here and not in the `test` job — that job never builds the website.
      #
      # Checks the static site: every docs URL prerendered as a file, plus
      # llms.txt, sitemap.xml, robots.txt, 200.html and 404.html, and no Docus
      # assistant endpoint anywhere in it (test/site.build.test.ts).
      - name: Check generated site
        run: pnpm --filter website run test:build

      # The search and AI search checks from @uxfront/site-checks: the core rules
      # (apps/docs/site-checks.config.mjs) on every page in the sitemap.
      - name: Check SEO
        run: pnpm --filter website run check:seo

      # `.output/public` is `generate`'s real output. The previous path,
      # `apps/docs/dist`, is an untracked symlink Nuxt only creates on
      # `generate` — under `build` it never existed and this artifact uploaded
      # nothing.
      - name: Upload website build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-build
          path: apps/docs/.output/public
          include-hidden-files: true
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: ui

      - name: Run oxlint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

  # Builds each framework package's API report from Build Packages' artifacts and compares it with
  # the committed `ui/<framework>/test/api.json`, once per run. A difference fails the job with the
  # lines that differ and the command that writes the reports again
  # (docs/adrs/013-api-reports-are-checked-once.md).
  api-report:
    name: API Report
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: ui

      - name: Check the API reports
        run: pnpm --filter @inkline/components run api:check

  # Deliberately does not reuse the `build` artifacts. Package types resolve through each package's
  # `exports` into `dist/`, so a check run against someone else's `dist` is only as trustworthy as
  # the coupling that delivered it — and the same check run locally against a stale `dist` reports
  # success on the pre-change types. `pnpm run typecheck` builds first, which makes that impossible
  # and makes this job byte-identical to what a contributor runs. It costs one extra build, in
  # parallel with `build` rather than after it, so wall-clock is roughly unchanged.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Run type checking
        run: pnpm run typecheck

  test:
    name: Unit Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: ui

      - name: Run tests
        # Each shard runs only part of the suite, so per-package coverage is partial. Disable the
        # 100% coverage thresholds for the sharded run (Codecov merges the two shard uploads); the
        # gate still applies to full local `vitest run --coverage` runs. A CLI flag is used rather than
        # an env var because Turbo runs tasks with only the env vars `turbo.json` names.
        # The `--` ends Turbo's own options: Turbo passes what follows it to each package's `test`
        # script, `vitest run`, with no `--` in front, since Vitest ignores everything after a `--`
        # that isn't its first argument. So no package's `test` script may repeat one of these
        # flags, or Vitest fails on the repeat.
        run: >-
          pnpm run test --
          --coverage --shard=${{ matrix.shard }}/2 --passWithNoTests
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.statements=0
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: shard-${{ matrix.shard }}

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Install Playwright Chromium
        run: pnpm --filter @inkline/components exec playwright install --with-deps chromium

      - name: Check the recipe types and the barrel split
        run: pnpm --filter @inkline/components run test:recipes

      # Every case on every target, in Chromium and in a server render, compared with the
      # expectations under ui/components/test/*/*/__expected__.
      - name: Run the component tests on every target
        run: pnpm --filter @inkline/components run test:targets

  visual:
    name: Visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Install Playwright Chromium
        run: pnpm --filter @inkline/components exec playwright install --with-deps chromium

      # Every example on every target, compared with the reference's capture in the same run.
      - name: Render the examples on every target
        run: pnpm --filter @inkline/components run visual

      - name: Upload the visual report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: ui/components/.unframework/visual
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Builds every preview the way Workers Builds does for its Worker: the full preview for
  # `inkline-preview` (ui/components/wrangler.json), and one framework's preview for each
  # `inkline-preview-<framework>` (ui/<framework>/wrangler.json). So a change that breaks
  # any of them can't merge.
  build-preview:
    name: Build Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: uxfront-com/.github/.github/actions/setup@35f7cdaf9b3c62c04b411c6c454c6f75ae43e54b # main

      - name: Build the components
        run: pnpm --filter "@inkline/components..." build

      # Every example and component on every target, as a static site in ui/components/preview.
      - name: Build the preview
        run: pnpm --filter @inkline/components run preview:build

      # One target's examples and components each, in ui/components/preview-<framework>.
      - name: Build the per-framework previews
        run: |
          for framework in react vue svelte solid angular qwik astro; do
            pnpm --filter @inkline/components run "preview:build:$framework"
          done

      - name: Upload the previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview
          path: |
            ui/components/preview
            ui/components/preview-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - build
      - build-website
      - lint
      - api-report
      - typecheck
      - test
      - component-tests
      - visual
      - build-preview
    if: always()
    steps:
      # `skipped` stays allowed, so a needed job that gains a job-level `if:` later
      # doesn't fail the pipeline whenever it skips.
      - name: Check job status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
