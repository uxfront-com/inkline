# npm trusted publishing names the calling workflow's file, `changesets.yml`,
# as the workflow that may publish a package. Never rename or move this file:
# a publish would then fail with a misleading E404.
#
# The release itself runs in the shared workflow in uxfront-com/.github, pinned
# by commit SHA. It opens or updates the "chore: update versions" PR while
# changesets are pending. With `publish: false`, it never packs or publishes,
# so merging that PR publishes nothing.
name: Changesets

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one release runs at a time, and a waiting one is never cancelled
concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # A called workflow can only lower these. GitHub checks them against every
    # job of the shared workflow, so its publish job's `id-token: write` must be
    # granted here even though `publish: false` skips that job.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: uxfront-com/.github/.github/workflows/release.yml@18a1d7cb1576c8053a80f3d166cfefecd470f5b3 # main
    with:
      build: pnpm run ci:prepublish
      publish: false
      commit-message: "chore: update versions"
      pr-title: "chore: update versions"
